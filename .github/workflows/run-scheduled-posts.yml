name: Run due scheduled posts

# O plano Hobby da Vercel só permite Cron Jobs 1x por dia (vercel.json já tem esse como
# rede de segurança). Este workflow chama o endpoint a cada 5 minutos. O primeiro disparo
# ocorre no minuto 1, evitando o início da hora, quando o GitHub documenta maior carga e
# atrasos de workflows agendados. O endpoint é idempotente: cada destino é reivindicado
# atomicamente antes de publicar, então tentativas repetidas não duplicam publicações.
on:
  schedule:
    - cron: "1-59/5 * * * *"
  workflow_dispatch: {}

jobs:
  run-due:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Chamar /api/scheduled-posts/run-due
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then
            AUTH_HEADER="Authorization: Bearer $CRON_SECRET"
          else
            AUTH_HEADER="Authorization: "
          fi
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 10 \
            --max-time 330 \
            -X POST \
            -H "$AUTH_HEADER" \
            https://zenx-creative.vercel.app/api/scheduled-posts/run-due
